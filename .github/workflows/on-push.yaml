name: Continuous integration

on:
  push:
    branches-ignore:
      - main
    paths-ignore:
      - '**/*.md'
  workflow_call:
    outputs:
      version:
        description: This project's version, from the VERSION file
        value: ${{ jobs.build-fonts.outputs.version }}
      fira_code:
        description: FiraCode version the fonts were built from
        value: ${{ jobs.build-fonts.outputs.fira_code }}
      nerd_font_patcher:
        description: Nerd Fonts font-patcher version the fonts were built with
        value: ${{ jobs.build-fonts.outputs.nerd_font_patcher }}
      noto_devanagari:
        description: Noto Sans Devanagari version merged into the fonts
        value: ${{ jobs.build-fonts.outputs.noto_devanagari }}

jobs:
  build-fonts:
    name: Build fonts
    # Pinned, not ubuntu-latest: fontforge draws the outlines, so a silent
    # runner image bump would change the binaries with no commit behind it.
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.build.outputs.version }}
      fira_code: ${{ steps.build.outputs.fira_code }}
      nerd_font_patcher: ${{ steps.build.outputs.nerd_font_patcher }}
      noto_devanagari: ${{ steps.build.outputs.noto_devanagari }}
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fontforge python3-fontforge
          pip install -r requirements.txt
          fontforge --version
      - name: Cache downloads
        id: cache-downloads
        uses: actions/cache@v6
        with:
          path: downloads
          # Keyed on build.py, which pins every upstream version and checksum:
          # a constant key is only ever written once, so version bumps would
          # re-download on every run and the cache would never be refreshed.
          key: ${{ runner.os }}-downloads-${{ hashFiles('build.py') }}
      - name: Build
        id: build
        run: ./build.py
      - name: Verify fonts
        run: ./scripts/verify_fonts.py dist downloads
      - uses: actions/upload-artifact@v7
        with:
          name: fonts
          path: dist
          if-no-files-found: error
